# Снижены лимиты: на машинах с 16 ГБ RAM и Windows 11 дефолтные 8G+4G+512m
# приводят к OutOfMemoryError в G1 virtual space (hs_err_pid*.log).
# 4G heap + 1G metaspace + 256m codecache стабильно собирают крупные Flutter-проекты
# на 16 ГБ системах, оставляя 4-6 ГБ на нативный heap и саму ОС.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.19.10-hotspot
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
# Параллелизм ограничен, чтобы не плодить треды (каждый жрёт 512K-1M stack).
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
android.useAndroidX=true
android.overridePathCheck=true
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
# R8 в release-режиме: fullMode даёт меньший и быстрее собираемый APK,
# отключаем обфускацию только если она ломает плагины.
android.enableR8.fullMode=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
